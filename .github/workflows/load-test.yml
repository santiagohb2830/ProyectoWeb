name: Load Tests

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'lulo-starter/backend/**'
  workflow_dispatch:
  schedule:
    # Ejecución semanal (domingos a la medianoche UTC)
    - cron: '0 0 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        threads: [20, 100, 300]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.TEST_DB_USER || 'lulo_test' }}
          POSTGRES_PASSWORD: ${{ secrets.TEST_DB_PASS || 'lulo_pass' }}
          POSTGRES_DB: lulo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      influxdb:
        image: influxdb:1.8
        ports:
          - 8086:8086
        env:
          INFLUXDB_DB: jmeter

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Spring Boot application (Background)
        working-directory: lulo-starter/backend
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/lulo_test
          TEST_DB_USER: ${{ secrets.TEST_DB_USER || 'lulo_test' }}
          TEST_DB_PASS: ${{ secrets.TEST_DB_PASS || 'lulo_pass' }}
          SPRING_PROFILES_ACTIVE: test
        run: |
          mvn spring-boot:run &
          echo "Esperando a que la aplicación inicie..."
          # Esperar hasta que el healthcheck responda 200 OK (Timeout de 60s)
          timeout 60 bash -c 'while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' localhost:8080/actuator/health)" != "200" ]]; do sleep 2; done' || false
          echo "Aplicación levantada exitosamente."

      - name: Run JMeter Load Tests
        working-directory: lulo-starter/backend
        env:
          THREADS: ${{ matrix.threads }}
        run: |
          # Se pasa la propiedad threads a jmeter para sobreescribir la carga
          mvn integration-test -Djmeter.threads=${{ matrix.threads }}

      - name: Check Performance Thresholds
        if: always()
        env:
          P95_THRESHOLD_MS: 2000
          ERROR_RATE_PCT: 1
        run: |
          chmod +x .github/scripts/threshold-check.sh
          .github/scripts/threshold-check.sh

      - name: Upload JMeter HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-html-report-${{ matrix.threads }}-threads
          path: lulo-starter/backend/target/jmeter/reports/
          retention-days: 7
